name: Zapasy gazu EIA

on:
  schedule:
    # raport: czwartek 10:30 czasu nowojorskiego (w tygodniu świąt środa 12:00); kilka prób po publikacji
    - cron: '40 15,16,17,18 * * 3,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency: gwhdd

jobs:
  zapasy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python zapasy.py
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - name: Zapisz wyniki
        run: |
          git config user.name "gwhdd-bot"
          git config user.email "gwhdd-bot@users.noreply.github.com"
          git add data
          git commit -m "Zapasy EIA $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase -X theirs || true
          git push

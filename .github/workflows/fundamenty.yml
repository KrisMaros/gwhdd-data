name: Fundamenty (COT i LNG)

on:
  schedule:
    # COT: piątek 15:30 czasu nowojorskiego; przegląd EIA z LNG: zwykle czwartek (w tygodniu świąt środa)
    - cron: '30 21 * * 3,4,5'
    - cron: '0 12 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency: gwhdd

jobs:
  fundamenty:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python fundamenty.py
      - name: Zapisz wyniki
        run: |
          git config user.name "gwhdd-bot"
          git config user.email "gwhdd-bot@users.noreply.github.com"
          git add data
          git commit -m "Fundamenty $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase -X theirs || true
          git push

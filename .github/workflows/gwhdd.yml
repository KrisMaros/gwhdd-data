name: Odczyt GWHDD i cen gazu

on:
  schedule:
    # co 2 godziny (minuta 17); ciężkie liczenie tylko gdy są nowe przebiegi modeli
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: gwhdd

jobs:
  odczyt:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python gwhdd.py
      - name: Zapisz wyniki
        run: |
          git config user.name "gwhdd-bot"
          git config user.email "gwhdd-bot@users.noreply.github.com"
          git add data
          git commit -m "Odczyt $(date -u +%Y-%m-%dT%H:%MZ)" || echo "bez zmian"
          git pull --rebase -X theirs || true
          git push
